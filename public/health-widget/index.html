<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elmybot Health Bar</title>
  <style>
    html, body { margin: 0; background: transparent; }
    body { font: 700 20px system-ui, sans-serif; color: white; }
    main { box-sizing: border-box; width: min(700px, 96vw); padding: 16px; }
    .labels, #status, #access, #migration {
      color: #f4f4f5;
      background: #18181b;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .labels { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .meter {
      height: 38px;
      overflow: hidden;
      border: 3px solid white;
      border-radius: 12px;
      background: #292929;
      box-shadow: 0 4px 15px #0009;
    }
    .fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #25a85d, #70ed85);
    }
    .ready .fill { transition: width 650ms cubic-bezier(.2, .8, .2, 1); }
    #status { margin: 8px 0; font: 14px system-ui, sans-serif; }
    #access { display: grid; gap: 6px; margin-top: 10px; font: 14px system-ui, sans-serif; }
    #access[hidden] { display: none; }
    #migration { font: 14px system-ui, sans-serif; }
    a { color: #b9d8ff; }
    #access input { width: min(440px, 70vw); }
  </style>
  <script type="module" src="/health-widget/app.js"></script>
</head>
<body>
  <main>
    <div class="labels"><span>HEALTH</span><span id="value">— / 100</span></div>
    <div id="meter" class="meter" hidden role="progressbar"
         aria-label="Health" aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="100">
      <div id="fill" class="fill"></div>
    </div>
    <p id="status">Connecting…</p>

    <form id="access" hidden>
      <label for="read-grant">Current-health read grant:</label>
      <input id="read-grant" placeholder="Paste the current-health read grant" type="password" autocomplete="off" required>
      <label for="grant">Health v2 event grant:</label>
      <input id="grant" placeholder="Paste the health v2 event grant" type="password" autocomplete="off" required>
      <button type="submit">Connect</button>
    </form>
    <p id="migration">Bot health starts at 100; old browser-local values are not imported.
      <a href="/health-widget/legacy.html">Legacy v1 backlog view</a></p>
  </main>
</body>
</html>
