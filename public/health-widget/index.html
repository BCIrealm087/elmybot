<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elmybot Health Bar</title>
  <style>
    html, body { margin: 0; background: transparent; }
    body { font: 700 20px system-ui, sans-serif; color: white; }
    main { box-sizing: border-box; width: min(700px, 96vw); padding: 16px; }
    .labels { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .meter {
      height: 38px;
      overflow: hidden;
      border: 3px solid white;
      border-radius: 12px;
      background: #292929;
      box-shadow: 0 4px 15px #0009;
    }
    .fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #25a85d, #70ed85);
    }
    .ready .fill { transition: width 650ms cubic-bezier(.2, .8, .2, 1); }
    .meter.damage { animation: hit 450ms ease-out; }
    .meter.heal { animation: healed 550ms ease-out; }
    @keyframes hit {
      25% { transform: translateX(-7px); box-shadow: 0 0 25px #ff4242; }
      55% { transform: translateX(5px); }
    }
    @keyframes healed {
      50% { box-shadow: 0 0 28px #76ff9a; }
    }
    #status { margin: 8px 0; font: 14px system-ui, sans-serif; }
    #access { margin-top: 10px; font: 14px system-ui, sans-serif; }
    #access input { width: min(440px, 70vw); }
  </style>
  <script type="module" src="/health-widget/app.js"></script>
</head>
<body>
  <main>
    <div class="labels"><span>HEALTH</span><span id="value">100 / 100</span></div>
    <div id="meter" class="meter" role="progressbar"
         aria-label="Health" aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="100">
      <div id="fill" class="fill"></div>
    </div>
    <p id="status">Connecting…</p>

    <form id="access" hidden>
      <label for="grant">Event grant:</label>
      <input id="grant" type="password" autocomplete="off" required>
      <button type="submit">Connect</button>
    </form>
  </main>
</body>
</html>
