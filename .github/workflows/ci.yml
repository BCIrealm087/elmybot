name: CI

on:
  push:
    branches:
      - master
      - codex-querying-experiment
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run test suite
        run: npm test -- --run

      - name: Run linter
        run: npm run lint

      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:browser
        env:
          BROWSER_SMOKE_SCREENSHOT: browser-smoke.png

      - name: Save browser smoke preview
        uses: actions/upload-artifact@v4
        with:
          name: state-query-browser-preview
          path: browser-smoke.png
          retention-days: 7

      - name: Check JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check

      - name: Build Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
